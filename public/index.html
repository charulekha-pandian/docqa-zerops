<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DocQuery — Reading Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2EFE6;
    --panel: #FBFAF5;
    --ink: #21262B;
    --ink-soft: #5B5647;
    --line: #D8D2C2;
    --pine: #2B5D5A;
    --pine-dark: #1E4341;
    --brick: #B4472A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  /* ---------- Sidebar: session history ---------- */
  .drawer {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .drawer-label {
    padding: 20px 18px 14px;
    border-bottom: 2px solid var(--ink);
  }
  .drawer-label .mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pine);
    display: block;
    margin-bottom: 4px;
  }
  .drawer-label h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .new-session-btn {
    margin: 14px 14px 6px;
    padding: 9px;
    background: var(--pine);
    color: var(--panel);
    border: none;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .new-session-btn:hover { background: var(--pine-dark); }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 20px;
  }
  .session-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 10px 8px 6px;
  }
  .session-item {
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 3px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.4;
    border: 1px solid transparent;
  }
  .session-item:hover { background: var(--paper); }
  .session-item.active {
    background: var(--paper);
    border-color: var(--line);
    border-left: 3px solid var(--brick);
  }
  .session-item .title {
    color: var(--ink);
    word-break: break-word;
  }
  .empty-note {
    padding: 16px 8px;
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  /* ---------- Main pane ---------- */
  .room {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .room-header {
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
  }
  .room-header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pine);
    margin-bottom: 4px;
  }
  .room-header h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    color: var(--ink-soft);
  }

  /* Compact per-session document catalog bar */
  .doc-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 32px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .doc-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 10px;
    color: var(--ink-soft);
  }
  .doc-bar-upload {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .doc-bar-upload input[type=file] {
    font-size: 11px;
    max-width: 140px;
  }
  .doc-bar-upload button {
    padding: 5px 12px;
    background: var(--pine);
    color: var(--panel);
    border: none;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .doc-bar-upload button:hover { background: var(--pine-dark); }
  .doc-bar-upload button:disabled { background: var(--line); cursor: default; }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    max-width: 780px;
  }
  .welcome {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.7;
    max-width: 480px;
  }
  .welcome h3 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 10px;
  }
  .qa-block { margin-bottom: 32px; }
  .question-line {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    padding-left: 16px;
    border-left: 3px solid var(--brick);
  }
  .answer-text {
    font-size: 15px;
    line-height: 1.75;
    white-space: pre-wrap;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .answer-text.pending { color: var(--ink-soft); font-style: italic; }

  .sources-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .index-cards { display: flex; flex-direction: column; gap: 8px; }
  .index-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--pine);
    border-radius: 2px;
    padding: 10px 14px;
  }
  .index-card .call-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--pine);
    margin-bottom: 4px;
  }
  .index-card .snippet { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

  .composer {
    border-top: 1px solid var(--line);
    padding: 16px 32px 22px;
    background: var(--panel);
  }
  .composer form { display: flex; gap: 10px; max-width: 780px; }
  .composer input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  .composer input[type=text]:focus { outline: 2px solid var(--pine); outline-offset: 1px; }
  .composer button {
    padding: 12px 22px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .composer button:hover { background: var(--pine-dark); }
  .composer button:disabled { background: var(--line); cursor: default; }

  .no-session {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .drawer { height: auto; max-height: 220px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="drawer">
    <div class="drawer-label">
      <span class="mark">Doc · Query</span>
      <h1>Reading Room</h1>
    </div>
    <button class="new-session-btn" onclick="newSession()">+ Begin new chat</button>
    <div class="session-list">
      <div class="session-eyebrow">Past chats</div>
      <div id="sessions"></div>
    </div>
  </aside>

  <main class="room" id="room">
    <div class="no-session">Start a new chat, or pick one from the left, to begin.</div>
  </main>
</div>

<script>
let activeSessionId = null;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadSessions() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();
  const container = document.getElementById('sessions');
  if (sessions.length === 0) {
    container.innerHTML = '<div class="empty-note">No chats yet.</div>';
    return;
  }
  container.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === activeSessionId ? 'active' : ''}" onclick="openSession('${s.id}')">
      <div class="title">${escapeHtml(s.title)}</div>
    </div>
  `).join('');
}

async function newSession() {
  const res = await fetch('/api/sessions', { method: 'POST' });
  const session = await res.json();
  await loadSessions();
  openSession(session.id);
}

async function openSession(id) {
  activeSessionId = id;
  await loadSessions();

  const res = await fetch(`/api/sessions/${id}`);
  const data = await res.json();
  renderRoom(data);
}

function renderRoom(data) {
  const { session, documents, messages } = data;
  const room = document.getElementById('room');

  room.innerHTML = `
    <div class="room-header">
      <div class="eyebrow">Ask the archive</div>
      <h2>${escapeHtml(session.title)}</h2>
    </div>
    <div class="doc-bar" id="docBar"></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <form id="askForm">
        <input type="text" id="question" placeholder="What would you like to know?" autocomplete="off" />
        <button type="submit" id="askBtn">Ask</button>
      </form>
    </div>
  `;

  renderDocBar(documents);
  renderThread(messages);

  document.getElementById('askForm').addEventListener('submit', ask);
}

function renderDocBar(documents) {
  const bar = document.getElementById('docBar');
  const chips = documents.length === 0
    ? '<span class="doc-chip">No documents filed yet</span>'
    : documents.map(d => `<span class="doc-chip">${escapeHtml(d.filename)} · ${d.chunk_count}p</span>`).join('');

  bar.innerHTML = `
    ${chips}
    <div class="doc-bar-upload">
      <input type="file" id="file" accept=".pdf,.txt,.md" />
      <button id="uploadBtn" onclick="upload()">File it</button>
    </div>
  `;
}

function renderThread(messages) {
  const thread = document.getElementById('thread');
  if (messages.length === 0) {
    thread.innerHTML = `
      <div class="welcome">
        <h3>Nothing asked yet</h3>
        <p>File a document above, then ask a question below. Answers cite exactly which passages they drew from — nothing outside this chat's documents.</p>
      </div>
    `;
    return;
  }
  thread.innerHTML = messages.map(m => renderBlock(m.question, m.answer, m.sources)).join('');
  thread.scrollTop = thread.scrollHeight;
}

function renderBlock(question, answer, sources) {
  const cardsHtml = (sources || []).map((s, i) => `
    <div class="index-card">
      <div class="call-number">[${i + 1}] ${escapeHtml(s.filename)}</div>
      <div class="snippet">${escapeHtml(s.snippet)}…</div>
    </div>
  `).join('');
  const sourcesHtml = sources && sources.length > 0
    ? `<div class="sources-label">Cited from</div><div class="index-cards">${cardsHtml}</div>`
    : '';
  return `
    <div class="qa-block">
      <div class="question-line">${escapeHtml(question)}</div>
      <div class="answer-text">${escapeHtml(answer)}</div>
      ${sourcesHtml}
    </div>
  `;
}

async function upload() {
  if (!activeSessionId) return;
  const fileInput = document.getElementById('file');
  const file = fileInput.files[0];
  if (!file) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = 'Filing…';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(`/api/sessions/${activeSessionId}/documents`, { method: 'POST', body: fd });
    if (!res.ok) throw new Error('Upload failed');
    const refreshed = await fetch(`/api/sessions/${activeSessionId}`);
    const data = await refreshed.json();
    renderDocBar(data.documents);
  } catch (e) {
    alert('Could not file that document — try again.');
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('uploadBtn').textContent = 'File it';
  }
}

async function ask(evt) {
  evt.preventDefault();
  if (!activeSessionId) return;
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question) return;

  document.querySelector('.welcome')?.remove();

  const thread = document.getElementById('thread');
  const block = document.createElement('div');
  block.className = 'qa-block';
  block.innerHTML = `
    <div class="question-line">${escapeHtml(question)}</div>
    <div class="answer-text pending">Reading the catalog…</div>
  `;
  thread.appendChild(block);
  thread.scrollTop = thread.scrollHeight;

  input.value = '';
  document.getElementById('askBtn').disabled = true;

  try {
    const res = await fetch(`/api/sessions/${activeSessionId}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();

    const answerEl = block.querySelector('.answer-text');
    answerEl.classList.remove('pending');
    answerEl.textContent = data.answer || data.error || 'No answer returned.';

    if (data.sources && data.sources.length > 0) {
      const cardsHtml = data.sources.map((s, i) => `
        <div class="index-card">
          <div class="call-number">[${i + 1}] ${escapeHtml(s.filename)}</div>
          <div class="snippet">${escapeHtml(s.snippet)}…</div>
        </div>
      `).join('');
      block.insertAdjacentHTML('beforeend', `
        <div class="sources-label">Cited from</div>
        <div class="index-cards">${cardsHtml}</div>
      `);
    }

    await loadSessions(); // title may have auto-updated from the first question
  } catch (e) {
    const answerEl = block.querySelector('.answer-text');
    answerEl.classList.remove('pending');
    answerEl.textContent = 'Something went wrong reaching the archive — try again.';
  } finally {
    document.getElementById('askBtn').disabled = false;
    thread.scrollTop = thread.scrollHeight;
  }
}

loadSessions();
</script>
</body>
</html>
